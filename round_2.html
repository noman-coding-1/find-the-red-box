<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Find the Red Box </title>

    <link rel="stylesheet" href="index_1.css">
</head>

<body>

    <div class="game-container">

        <div class="header">
            <div class="title">
                🎯
                <h1>Find the <span>Red</span> Box</h1>
            </div>

            <div class="level">
                Level 1<br>
                <small>(8 boxes)</small>
            </div>

            <div class="level">
                Level 2<br>
                <small>(8 boxes)</small>
            </div>

            <div class="level">
                Level 3<br>
                <small>(8 boxes)</small>
            </div>

            <div class="level">
                Level 4<br>
                <small>(8 boxes)</small>
            </div>

            <div class="level">
                Level 5<br>
                <small>(8 boxes)</small>
            </div>
        </div>

         <p class="subtitle">
                Click the red box. Don't get caught!
         </p>

       


        <div class="game-board">

            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>

            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>

        </div>


        <div class="bottom">
            <p>Click on any box (except the red one).</p>
            <small>
                You won't see the red box, just click and find it!
            </small>
        </div>

    </div>

</body>
</html>
